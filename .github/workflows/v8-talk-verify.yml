# Перепроверка чисел доклада на настоящем linux/x64: тот же образ и тот же verify.sh, что локально.
# Запуск руками: Actions → v8-talk-verify → Run workflow. Результат — артефакт NUMBERS.md + сырые логи.
name: v8-talk-verify
on:
  push:
    branches: [v8-talk-verify]
  workflow_dispatch:
    inputs:
      runs:
        description: 'Сколько независимых прогонов (оценка шума раннера)'
        default: '3'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          echo "matrix=$(seq 1 ${{ inputs.runs || '3' }} | jq -cs '{run: ., node: ["24", "22"]}')" >> "$GITHUB_OUTPUT"
  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Железо раннера
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Architecture'
          nproc
      - name: Образ
        working-directory: v8-experiment
        run: |
          case "${{ matrix.node }}" in 24) TAG=24.21.0-alpine;; 22) TAG=22.23.2-alpine;; esac
          docker build --build-arg NODE_TAG=$TAG -t v8-talk-lab:${{ matrix.node }} docker
      - name: Прогон (строго последовательно, 2 CPU — как локально)
        working-directory: v8-experiment
        run: |
          docker run --rm --cpus 2 -v "$PWD":/work v8-talk-lab:${{ matrix.node }} bash docker/verify.sh gha-node${{ matrix.node }}-run${{ matrix.run }}
          docker run --rm -v "$PWD":/work v8-talk-lab:${{ matrix.node }} node docker/report.js docker/out/gha-node${{ matrix.node }}-run${{ matrix.run }}
      - uses: actions/upload-artifact@v4
        with:
          name: numbers-node${{ matrix.node }}-run${{ matrix.run }}
          path: v8-experiment/docker/out/gha-node${{ matrix.node }}-run${{ matrix.run }}
  collect:
    # Складывает NUMBERS.md всех прогонов в ветку v8-talk-results (коммит от GITHUB_TOKEN новых запусков не вызывает)
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Коммит результатов
        run: |
          set -e
          git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout v8-talk-results 2>/dev/null || git checkout --orphan v8-talk-results
          git rm -rq --cached . 2>/dev/null || true
          D=gha/${{ github.run_id }}; mkdir -p $D
          for a in ../artifacts/*; do n=$(basename $a); mkdir -p $D/$n; cp $a/NUMBERS.md $a/env.txt $D/$n/ 2>/dev/null || true; cp $a/*.jsonl $a/wrongmap.txt $a/reader-status.txt $a/samemap.txt $D/$n/ 2>/dev/null || true; done
          git add gha
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "results: run ${{ github.run_id }}"
          git push --quiet origin v8-talk-results
